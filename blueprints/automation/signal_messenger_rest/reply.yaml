blueprint:
  name: Signal - reply to an authorized command
  description: >-
    Match an exact incoming command and reply in the same conversation.
    Enable receiving and configure event sender/group permissions first;
    Assist permissions alone do not enable this blueprint. Use Assist's prefix
    activation with a separate command such as /status. If Assist handles all
    direct messages, it normally consumes these commands; publishing handled
    messages as events can cause both Assist and this automation to reply.
    The response template can read Home Assistant states. Incoming message text
    is never evaluated as a template or service name.
  domain: automation
  input:
    account:
      name: Signal account
      selector:
        config_entry:
          integration: signal_messenger_rest
    command:
      name: Exact command
      default: /status
      selector:
        text:
    response:
      name: Response
      default: Home Assistant is running.
      selector:
        template:
triggers:
  - trigger: event
    event_type: signal_messenger_rest_message_received
    event_data:
      config_entry_id: !input account
      text: !input command
variables:
  response: !input response
conditions: []
actions:
  - action: signal_messenger_rest.send_message
    # Render the mapping together to preserve a phone author's leading "+".
    data: >-
      {{ dict(
          config_entry_id=trigger.event.data.config_entry_id,
          recipients=[trigger.event.data.conversation_id],
          message=response,
          quote_timestamp=trigger.event.data.timestamp,
          quote_author=trigger.event.data.sender_uuid or trigger.event.data.sender_number
      ) }}
mode: queued
max: 10
