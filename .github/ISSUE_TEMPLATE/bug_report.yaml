name: Bug report
description: Report an integration problem without sharing private messages or credentials.
body:
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: REST API version, mode, and add-on or standalone deployment
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics and relevant errors
      description: Remove phone numbers, sender UUIDs, group IDs, URLs, credentials and message contents. Do not attach raw receive envelopes.
