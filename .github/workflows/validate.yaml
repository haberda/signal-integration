name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --timeout=30 --cov=custom_components.signal_messenger_rest --cov-report=term-missing
  tests-latest-ha:
    # Detects Home Assistant changes, including to private pipeline internals.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pytest-homeassistant-custom-component
      - name: Install Assist dependencies at this Home Assistant release's pins
        run: |
          constraints="$(python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).with_name("package_constraints.txt"))')"
          python -m pip install -c "$constraints" gazetteer-matcher hassil home-assistant-intents pymicro-vad pyspeex-noise mutagen ha-ffmpeg
      - run: python -m pytest --timeout=30
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
